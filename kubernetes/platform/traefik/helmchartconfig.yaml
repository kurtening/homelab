apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        type: NodePort
        externalTrafficPolicy: Local

    ports:
      web:
        nodePort: 31799
      websecure:
        nodePort: 32025
