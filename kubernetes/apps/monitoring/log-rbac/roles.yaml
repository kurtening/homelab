# Keep these namespace-scoped. Alloy cannot request family-application logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: monitoring-logs, namespace: argocd}
rules:
  - {apiGroups: [''], resources: [pods], verbs: [get, list, watch]}
  - {apiGroups: [''], resources: [pods/log], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: monitoring-logs, namespace: argocd}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: monitoring-logs}
subjects: [{kind: ServiceAccount, name: alloy, namespace: monitoring}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: monitoring-logs, namespace: kube-system}
rules:
  - {apiGroups: [''], resources: [pods], verbs: [get, list, watch]}
  - {apiGroups: [''], resources: [pods/log], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: monitoring-logs, namespace: kube-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: monitoring-logs}
subjects: [{kind: ServiceAccount, name: alloy, namespace: monitoring}]
---
