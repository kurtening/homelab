global:
  resolve_timeout: 5m
route:
  receiver: discord
  group_by: [alertname, application, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/credentials/DISCORD_WEBHOOK_URL
        send_resolved: true
        title: 'Homelab {{ .Status }}: {{ .GroupLabels.alertname }}'
        message: >-
          Severity: {{ .GroupLabels.severity }}.
          {{ if .GroupLabels.application }}Service: {{ .GroupLabels.application }}.{{ end }}
          Inspect the private dashboard. Runbook:
          https://github.com/kurtening/homelab/blob/main/docs/monitoring.md
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, application]
