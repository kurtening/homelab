auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore: {store: inmemory}
schema_config:
  configs:
    - from: '2026-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
storage_config:
  filesystem: {directory: /loki/chunks}
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache
ingester:
  chunk_idle_period: 5m
  max_chunk_age: 1h
  wal: {enabled: true, dir: /loki/wal, replay_memory_ceiling: 64MB}
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 2
  delete_request_store: filesystem
limits_config:
  retention_period: 24h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_query_parallelism: 2
  max_query_series: 500
  max_entries_limit_per_query: 1000
  max_query_lookback: 24h
querier: {max_concurrent: 2}
analytics: {reporting_enabled: false}
