apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-budget
spec:
  hard:
    limits.memory: 2016Mi
    requests.storage: 12Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-private
spec:
  podSelector:
    matchExpressions:
      - {key: homelab.kurtening.dev/monitoring-proxy, operator: NotIn, values: ['true']}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
