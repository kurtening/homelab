apiVersion: v1
kind: Service
metadata:
  name: minecraft
  annotations:
    tailscale.com/hostname: minecraft
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: minecraft
    app.kubernetes.io/component: server
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: homelab
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/hostname: krof-desktop
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: docker.io/itzg/minecraft-server:2026.8.2-java25@sha256:efa878ddb49cf5251b2e5f2ad71b08fd2f7236c1f7907433f6697258b31d2ce4
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: minecraft-config
          env:
            - name: SEED
              valueFrom:
                secretKeyRef:
                  name: minecraft-bootstrap
                  key: seed
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 6Gi
          startupProbe:
            exec:
              command:
                - mc-health
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - mc-health
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mc-health
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
