apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default

  source:
    repoURL: https://github.com/kurtening/homelab.git
    targetRevision: main
    path: kubernetes/secrets/tailscale

  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
