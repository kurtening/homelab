apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft-admin-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/kurtening/homelab.git
    targetRevision: main
    path: kubernetes/secrets/minecraft-admin
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
