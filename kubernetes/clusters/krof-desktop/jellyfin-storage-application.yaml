apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default

  source:
    repoURL: https://github.com/kurtening/homelab.git
    targetRevision: main
    path: kubernetes/clusters/krof-desktop/storage/jellyfin

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - Prune=false
      - Delete=false
