name: Kubernetes validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kubernetes-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned tools
        uses: jdx/mise-action@v4.3.0

      - name: Render and validate manifests
        run: ./scripts/validate-kubernetes.sh

      - name: Check Jellyfin backup archive gate
        run: bash scripts/test-jellyfin-backup.sh

      - name: Check Jellyfin recovery tooling
        run: python3 scripts/test-jellyfin-recovery.py

      - name: Check Immich recovery tooling
        run: python3 scripts/test-immich-recovery.py

      - name: Check Immich backup dump pipeline
        run: python3 scripts/test-immich-backup.py

      - name: Check Minecraft backup save recovery and installation guards
        run: python3 scripts/test-minecraft-backup.py

      - name: Check monitoring collector and pinned configurations
        run: |
          python3 -m venv /tmp/monitoring-tests
          /tmp/monitoring-tests/bin/pip install -r scripts/requirements-monitoring.txt
          /tmp/monitoring-tests/bin/python scripts/test-monitoring-collector.py
          /tmp/monitoring-tests/bin/python scripts/test-monitoring-host.py
          /tmp/monitoring-tests/bin/python scripts/test-monitoring-manifests.py
          /tmp/monitoring-tests/bin/python scripts/validate-monitoring.py
