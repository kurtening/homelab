name: Kubernetes validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kubernetes-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned tools
        uses: jdx/mise-action@v4.3.0

      - name: Render and validate manifests
        run: ./scripts/validate-kubernetes.sh

      - name: Check Jellyfin backup archive gate
        run: bash scripts/test-jellyfin-backup.sh

      - name: Check Jellyfin recovery tooling
        run: python3 scripts/test-jellyfin-recovery.py

      - name: Check Immich recovery tooling
        run: python3 scripts/test-immich-recovery.py
