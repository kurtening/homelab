name: Minecraft client pack validation

on:
  pull_request:
    paths:
      - 'minecraft-client/**'
      - '.github/workflows/minecraft-client-validation.yaml'
  push:
    branches: [main]
    paths:
      - 'minecraft-client/**'
      - '.github/workflows/minecraft-client-validation.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Build and verify pinned pack
        run: python3 minecraft-client/build.py
